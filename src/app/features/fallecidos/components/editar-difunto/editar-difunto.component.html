<div class="modal-header border-0">
  <h5 class="modal-title fw-semibold">
    <i class="bi bi-pencil-square me-2 text-primary"></i>
    Editar difunto
  </h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Cerrar"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body pt-0">
  <form>
    <!-- DATOS PERSONALES -->
    <p class="fw-semibold text-muted mb-2">Datos del difunto</p>

    <div class="mb-3">
      <label class="form-label">Nombre completo</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="fallecido.nombre_completo"
        name="nombre_completo"
        placeholder="Ej: Juan Pérez"
        required
      />
    </div>

    <!-- FECHAS -->
    <p class="fw-semibold text-muted mt-3 mb-2">Fechas</p>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Fecha de fallecimiento</label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="fallecido.fecha_fallecimiento"
          name="fecha_fallecimiento"
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Fecha de inhumación</label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="fallecido.fecha_inhumacion"
          name="fecha_inhumacion"
        />
      </div>

      <div class="col-md-4 mb-3">
        <label class="form-label">Fecha de exhumación</label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="fallecido.fecha_exhumacion"
          name="fecha_exhumacion"
        />
      </div>
    </div>

    <!-- OBSERVACIONES -->
    <div class="mb-3">
      <label class="form-label">Observaciones</label>
      <textarea
        class="form-control"
        rows="3"
        placeholder="Notas adicionales (opcional)"
        [(ngModel)]="fallecido.observaciones"
        name="observaciones"
      ></textarea>
    </div>
  </form>
</div>

<div class="modal-footer border-0">
  <button
    type="button"
    class="btn btn-danger fw-semibold"
    (click)="activeModal.dismiss()"
  >
    Cancelar
  </button>

  <button
    type="button"
    class="btn btn-success fw-semibold"
    (click)="guardarCambios()"
  >
    <i class="bi bi-save me-1"></i>
    Guardar cambios
  </button>
</div>
