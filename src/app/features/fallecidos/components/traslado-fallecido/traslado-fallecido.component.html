<div class="modal-header border-0 pb-0">
  <h5 class="modal-title fw-semibold">
    <i class="bi bi-truck me-2"></i>Registrar traslado
  </h5>
  <button
    type="button"
    class="btn-close ms-auto"
    aria-label="Cerrar"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  <p class="text-muted small mb-3">
    Selecciona al fallecido e indica el destino del traslado. Este registro
    quedará en la bitácora.
  </p>

  <!-- Buscador de fallecido -->
  <div class="mb-3" *ngIf="!fallecidoSeleccionado">
    <label class="form-label small fw-semibold text-muted"
      >Buscar fallecido</label
    >
    <div class="input-group">
      <span class="input-group-text bg-light border-end-0">
        <i class="bi bi-search text-muted"></i>
      </span>
      <input
        type="text"
        class="form-control bg-light border-start-0"
        placeholder="Nombre del fallecido..."
        [(ngModel)]="nombreFallecido"
        (ngModelChange)="buscarFallecido()"
      />
    </div>

    <!-- Sugerencias -->
    <div class="list-group mt-2" *ngIf="sugerenciasFallecidos.length">
      <button
        type="button"
        *ngFor="let f of sugerenciasFallecidos"
        class="list-group-item list-group-item-action py-2"
        (click)="seleccionarFallecido(f)"
      >
        <div class="fw-medium small">{{ f.nombre_completo }}</div>
        <div class="text-muted" style="font-size: 11px">
          {{ f.codigo_bloque }}
        </div>
      </button>
    </div>
  </div>

  <!-- Fallecido seleccionado -->
  <div *ngIf="fallecidoSeleccionado" class="card border-0 bg-light mb-3">
    <div
      class="card-body d-flex align-items-center justify-content-between py-3"
    >
      <div>
        <div class="fw-semibold small">
          {{ fallecidoSeleccionado.nombre_completo }}
        </div>
        <div class="text-muted" style="font-size: 11px">
          Ubicación actual: {{ fallecidoSeleccionado.codigo_bloque }}
        </div>
      </div>
      <button
        class="btn btn-outline-secondary btn-sm"
        (click)="limpiarSeleccion()"
      >
        <i class="bi bi-x"></i>
      </button>
    </div>
  </div>

  <!-- Destino -->
  <div class="mb-2" *ngIf="fallecidoSeleccionado">
    <label class="form-label small fw-semibold text-muted"
      >Destino del traslado</label
    >
    <textarea
      class="form-control"
      rows="3"
      placeholder="Ej: Cementerio San Pablo, ciudad de Manta"
      [(ngModel)]="destino"
    ></textarea>
    <small class="text-muted">
      <i class="bi bi-info-circle me-1"></i>
      Este texto quedará registrado en la bitácora del sistema.
    </small>
  </div>
</div>

<div class="modal-footer border-0">
  <button
    type="button"
    class="btn btn-outline-secondary btn-sm"
    (click)="activeModal.dismiss()"
  >
    Cancelar
  </button>
  <button
    type="button"
    class="btn btn-success btn-sm fw-semibold"
    [disabled]="!fallecidoSeleccionado || !destino.trim() || guardando"
    (click)="guardarTraslado()"
  >
    <span
      *ngIf="guardando"
      class="spinner-border spinner-border-sm me-1"
    ></span>
    <i *ngIf="!guardando" class="bi bi-check-lg me-1"></i>
    {{ guardando ? "Registrando..." : "Registrar traslado" }}
  </button>
</div>
