<div class="mapa-wrapper" (click)="cerrarPopup()">
  <div *ngIf="cargando" class="mapa-loading">
    <div class="spinner-border text-success"></div>
  </div>

  <div *ngIf="errorCarga" class="mapa-error">
    <i class="bi bi-exclamation-triangle fs-2 text-warning d-block mb-2"></i>
    <p class="text-muted small">
      No se pudo cargar el mapa de este cementerio.
    </p>
  </div>

  <!-- Botón de capas — estilo Google Maps -->
  <button
    class="btn-toggle-capa btn btn-light shadow-sm"
    *ngIf="!cargando && !errorCarga"
    (click)="$event.stopPropagation(); toggleVista()"
    [title]="
      vistaNatural ? 'Ver mapa con manzanas' : 'Ver imagen real del cementerio'
    "
  >
    <i class="bi" [class]="vistaNatural ? 'bi-map' : 'bi-image'"></i>
    <span>{{ vistaNatural ? "Ver manzanas" : "Vista real" }}</span>
  </button>

  <div class="mapa-scroll" *ngIf="!cargando && !errorCarga">
    <div class="mapa-contenedor">
      <!-- Imagen — cambia según la capa activa -->
      <img
        [src]="vistaNatural ? urlMapaNatural : urlMapa"
        alt="Mapa del cementerio real"
        class="mapa-imagen"
      />

      <!-- SVG con polígonos — solo visible en la vista mapeada -->
      <svg
        *ngIf="!vistaNatural"
        class="mapa-svg"
        [attr.viewBox]="'0 0 ' + anchoImg + ' ' + altoImg"
        preserveAspectRatio="xMidYMid meet"
      >
        <polyline
          [attr.points]="caminoPoints"
          class="camino-borde"
          pointer-events="none"
        />

        <polyline
          [attr.points]="caminoPoints"
          class="camino"
          (click)="$event.stopPropagation(); seleccionarCamino()"
        >
          <title>Camino del cementerio</title>
        </polyline>

        <polygon
          *ngFor="let m of manzanas"
          [attr.points]="m.points"
          [attr.data-codigo]="m.codigo"
          class="manzana-poligono"
          [class.activa]="manzanaActiva?.codigo === m.codigo"
          [class.pulsando]="
            manzanaActiva?.codigo === m.codigo && manzanaPulsando
          "
          (click)="$event.stopPropagation(); seleccionarManzana(m)"
        >
          <title>Manzana {{ m.codigo }}</title>
        </polygon>
      </svg>
    </div>
  </div>

  <div
    class="popup-manzana"
    *ngIf="(manzanaActiva || caminoActivo) && !vistaNatural"
    (click)="$event.stopPropagation()"
  >
    <button class="popup-cerrar" (click)="cerrarPopup()">
      <i class="bi bi-x"></i>
    </button>

    <ng-container *ngIf="manzanaActiva">
      <div class="popup-fallecido" *ngIf="fallecidoLocalizado">
        <div class="popup-fallecido-icono">
          <i class="bi bi-person-check-fill"></i>
        </div>
        <div>
          <div class="popup-fallecido-nombre">
            {{ fallecidoLocalizado.nombre }}
          </div>
          <div class="popup-fallecido-codigo">
            Código: <strong>{{ fallecidoLocalizado.codigo }}</strong>
          </div>
        </div>
      </div>

      <div class="popup-titulo">
        Manzana {{ manzanaActiva.manzana }} del
        {{ nombreSector(manzanaActiva.sector) }}
      </div>
      <div class="popup-sub">{{ nombreSector(manzanaActiva.sector) }}</div>
    </ng-container>

    <ng-container *ngIf="caminoActivo">
      <div class="popup-titulo">Camino del cementerio</div>
      <div class="popup-sub">Vía de circulación peatonal</div>
    </ng-container>
  </div>
</div>
