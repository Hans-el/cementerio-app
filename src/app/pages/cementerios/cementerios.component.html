<div class="seleccionar-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="container" style="max-width: 800px">
    <!-- Header -->
    <div class="text-center mb-5">
      <img src="assets/faviconblanco.png" alt="Logo" width="80" class="mb-3"
        style="filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2))" />
      <h2 class="fw-bold text-white mb-1">Sistema de Gestión de Cementerios</h2>
      <p class="text-white-50">
        Selecciona el cementerio al que deseas acceder
      </p>
    </div>

    <!-- Cargando -->
    <div *ngIf="cargando" class="text-center py-5">
      <div class="spinner-border text-white"></div>
    </div>

    <!-- Error -->
    <div *ngIf="error" class="alert alert-danger text-center">
      <i class="bi bi-exclamation-circle me-2"></i>
      No se pudieron cargar los cementerios. Intenta de nuevo.
    </div>

    <!-- Lista de cementerios -->
    <div *ngIf="!cargando && !error" class="row g-4 justify-content-center">
      <div *ngFor="let c of cementerios" class="col-md-6 col-lg-4">
        <div class="cementerio-card" (click)="seleccionar(c)" style="cursor: pointer">
          <h5 class="fw-semibold mb-1">
            {{ c.nombre }}
          </h5>

          <div class="d-flex flex-column gap-1 text-muted small" *ngIf="c.direccion || c.telefono">
            <span *ngIf="c.direccion">
              <i class="bi bi-geo-alt me-1"></i>{{ c.direccion }}
            </span>
            <span *ngIf="c.telefono">
              <i class="bi bi-telephone me-1"></i>{{ c.telefono }}
            </span>
          </div>


        </div>
      </div>
    </div>
  </div>
</div>
