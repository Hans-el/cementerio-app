<div class="container py-5" style="max-width: 700px">
  <div class="mb-5">
    <h3 class="fw-semibold text-secondary mb-1">
      <i class="bi bi-file-earmark-text me-2 text-success"></i>Trámites
    </h3>
    <p class="text-muted small mb-0">
      Selecciona el tipo de trámite que deseas realizar.
    </p>
  </div>
  <div
    class="alert alert-info d-flex align-items-start gap-2 mt-4"
    *ngIf="!cargando"
  >
    <i class="bi bi-info-circle-fill mt-1 shrink-0"></i>
    <div class="small">
      Una vez enviada tu solicitud, la administración la revisará. Los trámites
      con costo requieren pago presencial en la administración.
    </div>
  </div>

  <!-- Cargando -->
  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-success"></div>
  </div>

  <!-- Grid de trámites -->
  <div *ngIf="!cargando" class="row g-4">
    <div *ngFor="let t of tipos" class="col-md-6">
      <div
        class="card border shadow-sm h-100 hover-lift"
        style="cursor: pointer"
        (click)="irATramite(t.id_tipo_tramite)"
      >
        <div class="card-body p-4 d-flex flex-column">
          <div
            class="rounded-3 p-3 mb-3"
            style="width: fit-content"
            [class]="'bg-' + colorPorTipo(t.nombre) + ' bg-opacity-25'"
          >
            <i
              class="bi fs-2"
              [class]="iconoPorTipo(t.nombre)"
              [class.text-success]="colorPorTipo(t.nombre) === 'success'"
              [class.text-warning]="colorPorTipo(t.nombre) === 'warning'"
              [class.text-primary]="colorPorTipo(t.nombre) === 'primary'"
              [class.text-info]="colorPorTipo(t.nombre) === 'info'"
            >
            </i>
          </div>

          <h5 class="fw-semibold mb-2">{{ t.nombre }}</h5>
          <p class="text-muted small mb-3 grow">{{ t.descripcion }}</p>

          <div
            class="d-flex align-items-center justify-content-between mt-auto"
          >
            <span
              class="badge px-3 py-2 rounded-pill bg-light border text-secondary fw-semibold"
            >
              {{ t.es_gratuito ? "Gratuito" : "$" + t.costo }}
            </span>
            <button class="btn btn-sm btn-success fw-semibold">
              Solicitar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Info -->
</div>
