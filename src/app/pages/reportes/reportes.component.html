<div class="container my-5">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0">
      <h3 class="fw-bold mb-2 text-success">
        <i class="bi bi-file-earmark-bar-graph me-2 text-success"></i>
        Generar reportes
      </h3>
    </div>

    <div class="card-body">
      <form>
        <!-- TIPO DE REPORTE -->
        <p class="fw-semibold text-muted mb-2">Configuración del reporte</p>

        <div class="mb-3">
          <label for="reportType" class="form-label">Tipo de reporte</label>
          <select
            id="reportType"
            class="form-select"
            [(ngModel)]="reportType"
            name="reportType"
          >
            <option value="ocupaciones">Ocupaciones</option>
            <option value="fallecidos">Fallecidos</option>
            <option value="bloques">Bloques</option>
          </select>
        </div>

        <!-- RANGO DE FECHAS -->
        <div class="form-check mb-3">
          <input
            type="checkbox"
            class="form-check-input"
            id="useDateRange"
            [(ngModel)]="useDateRange"
            name="useDateRange"
          />
          <label class="form-check-label" for="useDateRange">
            Usar rango de fechas
          </label>
        </div>

        <div *ngIf="useDateRange" class="row">
          <div class="col-md-6 mb-3">
            <label for="startDate" class="form-label">Fecha inicio</label>
            <input
              type="date"
              id="startDate"
              class="form-control"
              [(ngModel)]="startDate"
              name="startDate"
            />
          </div>

          <div class="col-md-6 mb-3">
            <label for="endDate" class="form-label">Fecha fin</label>
            <input
              type="date"
              id="endDate"
              class="form-control"
              [(ngModel)]="endDate"
              name="endDate"
            />
          </div>
        </div>

        <!-- ACCIÓN -->
        <div class="mt-4">
          <button
            type="button"
            class="btn btn-success fw-semibold"
            (click)="generateReport()"
          >
            <i class="bi bi-gear-fill me-1"></i>
            Generar reporte
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
