<div class="container my-4 mx-auto">
  <!-- ENCABEZADO DE PÁGINA -->
  <div class="mb-4">
    <h4 class="fw-semibold mb-1">
      <i class="bi bi-file-earmark-bar-graph me-2 text-primary"></i>
      Generar reportes
    </h4>
    <p class="text-muted mb-0">
      Seleccione los criterios para generar reportes del sistema
    </p>
  </div>

  <!-- TARJETA PRINCIPAL -->
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form>
        <!-- TIPO DE REPORTE -->
        <p class="fw-semibold text-muted mb-2">Tipo de reporte</p>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="reportType" class="form-label"> Tipo de reporte </label>
            <select
              id="reportType"
              class="form-select"
              [(ngModel)]="reportType"
              name="reportType"
            >
              <option value="ocupaciones">Ocupaciones</option>
              <option value="fallecidos">Fallecidos</option>
              <option value="bloques">Bloques</option>
            </select>
          </div>
        </div>

        <!-- RANGO DE FECHAS -->
        <p class="fw-semibold text-muted mt-3 mb-2">Rango de fechas</p>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="startDate" class="form-label">Fecha inicio</label>
            <input
              type="date"
              id="startDate"
              class="form-control"
              [(ngModel)]="startDate"
              name="startDate"
            />
          </div>

          <div class="col-md-4 mb-3">
            <label for="endDate" class="form-label">Fecha fin</label>
            <input
              type="date"
              id="endDate"
              class="form-control"
              [(ngModel)]="endDate"
              name="endDate"
            />
          </div>
        </div>

        <!-- ACCIONES -->
        <div class="mt-4">
          <button
            type="button"
            class="btn btn-success fw-semibold"
            (click)="generateReport()"
          >
            <i class="bi bi-bar-chart-line me-1"></i>
            Generar reporte
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
