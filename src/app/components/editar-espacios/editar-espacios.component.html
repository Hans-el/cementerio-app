<div class="modal-header border-0">
  <h5 class="modal-title fw-semibold">
    <i class="bi bi-layout-text-sidebar-reverse me-2 text-primary"></i>
    Editar espacios de bloque
  </h5>
  <button
    type="button"
    class="btn-close"
    aria-label="Cerrar"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body pt-0">
  <form>
    <!-- UBICACIÓN -->
    <p class="fw-semibold text-muted mb-2">Ubicación</p>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="sector" class="form-label">Sector</label>
        <select
          class="form-select"
          [(ngModel)]="espacioEdit.id_sector"
          name="sector"
          (change)="onSectorChange()"
          required
        >
          <option value="" disabled selected>Seleccione un sector</option>
          <option *ngFor="let sector of sectores" [value]="sector.id_sector">
            {{ sector.codigo }} - {{ sector.nombre }}
          </option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label for="manzana" class="form-label">Manzana</label>
        <select
          class="form-select"
          [(ngModel)]="espacioEdit.id_manzana"
          name="manzana"
          (change)="onManzanaChange()"
          [disabled]="!espacioEdit.id_sector"
          required
        >
          <option value="" disabled selected>Seleccione una manzana</option>
          <option *ngFor="let manzana of manzanas" [value]="manzana.id_manzana">
            {{ manzana.numero_manzana }}
          </option>
        </select>
      </div>

      <div class="col-md-4 mb-3">
        <label for="bloque" class="form-label">Bloque</label>
        <select
          class="form-select"
          [(ngModel)]="espacioEdit.id_bloque"
          name="bloque"
          (change)="onBloqueChange()"
          [disabled]="!espacioEdit.id_manzana"
          required
        >
          <option value="" disabled selected>Seleccione un bloque</option>
          <option *ngFor="let bloque of bloques" [value]="bloque.id_bloque">
            Bloque {{ bloque.numero_bloque }}
          </option>
        </select>
      </div>
    </div>

    <!-- ESPACIOS EXISTENTES -->
    <div class="mt-3" *ngIf="espacios.length > 0">
      <p class="fw-semibold text-muted mb-2">Espacios existentes</p>
      <ul class="list-group">
        <li class="list-group-item" *ngFor="let espacio of espacios">
          <i class="bi bi-dot me-1"></i>
          Espacio {{ espacio.numero_espacio }} — {{ espacio.tipo_espacio }}
        </li>
      </ul>
    </div>

    <!-- NUEVOS ESPACIOS -->
    <p class="fw-semibold text-muted mt-4 mb-2">Añadir nuevos espacios</p>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="cantidad_espacios" class="form-label">
          Cantidad de espacios a añadir
        </label>
        <input
          type="number"
          class="form-control"
          [(ngModel)]="nuevosEspacios.cantidad_espacios"
          name="cantidad_espacios"
          required
        />
      </div>

      <div class="col-md-6 mb-3">
        <label for="tipo_espacio" class="form-label">Tipo de espacio</label>
        <select
          class="form-select"
          [(ngModel)]="nuevosEspacios.id_tipo_espacio"
          name="tipo_espacio"
          required
        >
          <option
            *ngFor="let tipo of tiposEspacio"
            [value]="tipo.id_tipo_espacio"
          >
            {{ tipo.nombre }}
          </option>
        </select>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer border-0">
  <button
    type="button"
    class="btn btn-danger fw-semibold"
    (click)="activeModal.dismiss()"
  >
    Cerrar
  </button>

  <button
    type="button"
    class="btn btn-success fw-semibold"
    (click)="onSubmit()"
  >
    <i class="bi bi-plus-circle me-1"></i>
    Añadir espacios
  </button>
</div>
