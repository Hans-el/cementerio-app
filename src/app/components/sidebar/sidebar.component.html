<div class="sidebar" [ngClass]="{ 'collapsed': isCollapsed() }">
  <div class="sidebar-header">
    <button class="toggle-btn" (click)="toggleSidebar()">
      <i class="bi bi-list"></i>
    </button>
    <span *ngIf="!isCollapsed()" class="sidebar-title">Cementerio Colón</span>
  </div>
  <ul class="sidebar-menu">
    <li>
      <a routerLink="/inicio" routerLinkActive="active">
        <i class="bi bi-house-door"></i>
        <span *ngIf="!isCollapsed()">Inicio</span>
      </a>
    </li>
    <li>
      <a (click)="openLocalizarModal()" style="cursor: pointer;">
        <i class="bi bi-geo-alt"></i>
        <span *ngIf="!isCollapsed()">Localizar</span>
      </a>
    </li>
    <li>
      <a routerLink="/disponibilidad" routerLinkActive="active">
        <i class="bi bi-calendar-check"></i>
        <span *ngIf="!isCollapsed()">Disponibilidad</span>
      </a>
    </li>
    <li>
      <a routerLink="/contacto" routerLinkActive="active">
        <i class="bi bi-envelope"></i>
        <span *ngIf="!isCollapsed()">Contactarse</span>
      </a>
    </li>
    <!-- Sección de perfil -->
  <div class="profile-section">
    <div ngbDropdown container="body" placement="top-right">
      <button ngbDropdownToggle class="profile-btn d-flex align-items-center p-2 text-white bg-transparent border-0">
        <i class="bi bi-person-circle me-2"></i>
        <span *ngIf="!isCollapsed()">Perfil</span>
      </button>
      <div ngbDropdownMenu class="dropdown-menu-dark rounded-3 shadow-lg border-0">
        <button ngbDropdownItem class="dropdown-item" routerLink="/inicio/perfil">
          <i class="bi bi-gear me-2"></i> Configuración
        </button>
        <button ngbDropdownItem class="dropdown-item" (click)="logout()">
          <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
  </ul>
</div>
