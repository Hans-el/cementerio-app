<div class="modal-header">
  <h4 class="modal-title">Gestionar Bóvedas</h4>
  <button type="button" class="close" aria-label="Cerrar" (click)="activeModal.dismiss()">
    <span aria-hidden="true">&times;</span>
  </button>
</div>
<div class="modal-body">
  <div class="modal-footer justify-content-center">
    <button type="button" class="btn btn-primary bg-blend-color" (click)="Anadir()">Añadir</button>
    <button type="button" class="btn btn-primary" (click)="Editar()">Editar</button>
    <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">Cerrar</button>
  </div>
  <p><strong>Cédula del Propietario</strong></p>
  <input type="text" class="form-control" placeholder="Ej: 12345678" [(ngModel)]="cedula">
  <small class="form-text text-muted">
    Ingrese la cédula del propietario para <strong>gestionar</strong> su bóveda/nicho
  </small>
  <button type="button" class="btn btn-primary" (click)="buscar()">Buscar</button>


  <!-- Mostrar resultado de la búsqueda -->
  <div *ngIf="resultadoBusqueda && resultadoBusqueda.length > 0" class="mt-3 alert alert-success">
    <p><strong>Bóveda(s) encontrada(s):</strong></p>
    <div *ngFor="let nicho of resultadoBusqueda">
      <p>Sector: {{ nicho.sector }}, Número: {{ nicho.numero }}</p>
      <p>Estado: {{ nicho.estado }}</p>
      <hr *ngIf="resultadoBusqueda.length > 1">
    </div>
  </div>
  <!-- Mostrar mensaje de error -->
  <div *ngIf="mensajeError" class="mt-3 alert alert-danger">
    {{ mensajeError }}
  </div>
</div>
