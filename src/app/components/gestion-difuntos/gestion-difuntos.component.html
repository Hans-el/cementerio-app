<div class="modal-header border-0 pb-0">
  <h5 class="modal-title fw-semibold">
    <i class="bi bi-person-square me-2"></i>Gestionar Fallecidos
  </h5>
  <button
    type="button"
    class="btn-close ms-auto"
    aria-label="Cerrar"
    (click)="activeModal.dismiss()"
  ></button>
</div>

<div class="modal-body">
  <div class="modal-footer mb-2 gap-2 justify-content-center">
    <button
      type="button"
      class="btn btn-outline-success fw-bold bi-person-add"
      (click)="abrirModalAnadir()"
    >
      Añadir Fallecido
    </button>
    <button
      type="button"
      class="btn btn-outline-success fw-bold w-50 bi-pencil-square"
      (click)="abrirModalEditar()"
    >
      Editar Espacio
    </button>
  </div>
  <div class="modal-footer mb-2 gap-2 justify-content-center">
    <button
      type="button"
      class="btn btn-danger fw-semibold w-50"
      (click)="activeModal.dismiss()"
    >
      Cerrar
    </button>
  </div>

  <!-- Error si no hay resultados -->
  <div
    *ngIf="mensajeError && !cargando"
    class="alert alert-danger d-flex align-items-center p-2 my-2"
  >
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <div class="small">{{ mensajeError }}</div>
  </div>
</div>
